<html>
    <head>
        <title>Addition using functions</title>
    </head>
    <body>
        <script>
            function add(){
            let x=5;
            let y=6;
            let z=x+y;
            return z;
            }
            let sum = add();
            document.write('The Sum of x and y is' +sum);
        </script>
    </body>
</html>
