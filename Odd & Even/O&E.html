<html>
    <head>
        <title>Odd & Even</title>
    </head>
    <body>
        <script>
            function oddOreven (number){
                if (number % 2 == 0){
                document.write(number +' is an even number');
            } else{
                document.write(number +' is an odd number');
            }
        }
        let number = prompt("Enter the number:");
        oddOreven(number);
        </script>
    </body>
</html>
