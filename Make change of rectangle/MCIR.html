<html>
    <head>
        <title>Make changes in rectangle</title>
        <style>
            h2{
                text-align:center;
            }
            .rectangle{
                border: 1px solid black;
                width:200px;
                height: 200px;
                margin:auto;
            }
            .button{
                padding: 20px;
                width:200px;
                margin:auto;
                text-align:center;
            }
        </style>
    </head>
    <body>
        <h2>Make change in rectangle</h2>
        <div class="rectangle"></div>
        <div class="button">
            <button onclick="makeaCircle()">Make a Circle</button>
            <button onclick="hideRect()">Hide</button>
            <button onclick="showRect()">Show</button>
            </div>
            <script>
                let div=document.querySelector(".rectangle");
                function makeaCircle() {
                    div.style.borderRadius = "50%";
                }
                function hideRect() {
                    div.style.display="none";
                }
                function showRect() {
                    div.style.display="block";
                }
                div.onmouseenter = function () {
                    div.style.backgroundColor = "red";
                };
                div.onmouseleave = function () {
                    div.style.backgroundColor = "transparent";
                };
            </script>
    </body>
</html>
