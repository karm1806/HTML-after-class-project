<html>
    <head>
        <title>HTML DOM</title>
        <style>
            .Karm{
                color:aqua;
                background-color:green;
                padding:5px;
            }
        </style>
    </head>
    <body>
        <h1 id="heading">Welcome</h1>
        <p>Hello</p>
        <p>How are you?</p>
        <script>
            let div=document.createElement('div');
            div.id='myDiv';
            div.className='Karm';
            div.innerHTML='<p>Congrats! You have created a div element using Javascript</p>';
            document.body.append(div);
            let heading=document.getElementById("heading");
            heading.innerHTML="<h1>to Javascript</h1>";
            document.querySelector('header p').innerHTML="<strong>Good job!</strong>";
        </script>
    </body>
</html>
