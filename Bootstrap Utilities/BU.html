<html>
    <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Bootstarp Utilities</title>
          <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    </head>
    <body>
        <div class="jumbotron jumbotron-fluid">
            <h1>Jumbotron</h1>
        </div>
            <h4>We will learn about jumbotron</h4>
            <p>In bootstrap, the jumbotron is for make the word or image big highlight in color</p>
            <button type="button" class="btn btn-primary">Blue</button>
            <button type="button" class="btn btn-danger">Red</button>
            <button type="button" class="btn btn-success">Green</button>
            <button type="button" class="btn btn-info">Peacock</button>
            <button type="button" class="btn btn-warning">Yellow</button>
            <div class="containers">
                <div class="progress">
                    <div class="progress-bar" style="width: 70%">70%</div>
                </div>
            </div>
            <div class="container">
            <span class="badge badge-primary">Blue</span>
            <span class="badge badge-danger">Red</span>
            <span class="badge badge-warning">Yellow</span>
            <span class="badge badge-success">Green</span>
            <span class="badge badge-dark">Dark</span>
            </div>
    </body>
</html>
