<html>
    <head>
        <title>The Creepy Story</title>
        <style>
            body.dark {
                color:white;
                background-color:black;
            }
            button{
                display:block;
                margin:5px;
            }
            .textEntry{
                margin-top:12px;
                margin-bottom:15px;
            }
        </style>
    </head>
    <body>
        <h1>The basement</h1>
        <p id="story">I wanted to find my friend, and he was hiding in the basement.</p>
        <button onclick="getdark()">Get in the mood</button>
        <div class="TextEntry">Enter your name, if you dare <input type="text" id="name"></div>
        <button onclick="typeAndScream()">Please,Please Don't click me!</button>
        <button onclick="finishtheStory()">Tell me what happend</button>
        <script>
            function getdark() {
                document.body.className="dark";
            }
            function finishtheStory() {
                document.getElementById("story").innerHTML="So I carefully searched the damp dungeon. There you are!";
            }
            function typeAndScream() {
                var personName = document.getElementById("name").value;
                alert("I told you not to do that" + personName);
            }
        </script>
    </body>
</html>
