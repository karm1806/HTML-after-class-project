<html>
    <title>CSS Flexbox</title>
    <head>
        <style>
            .flex-container{
                display:flex;
                width:200px;
                background-color: lightskyblue;
                padding: 20px;
                flex-direction: column;
                align-items:center;
            }
            .flex-container div{
                width:200px;
                background-color: wheat;
                margin: 5px;
                padding: 5px;
            }
        </style>
    </head>
    <body>
<div class="flex-container">
    <div>10</div>
    <div>20</div>
    <div>30</div>
</div>
    </body>
</html>
