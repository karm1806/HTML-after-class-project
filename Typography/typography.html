<html>
    <head>
        <title>Typography</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            blockquote {
                border-left: 10px solid chocolate;
                padding-left: 15px;
                color: dimgray;
                font-style: italic;
                text-align: left;
                display: inline-block;
}
        </style>
    </head>
    <body>
        <p>Hello</p>
        <p class="display-1">This is about displays</p>
        <p class="display-4">This is the app of HTML <small>by Karm</small></p>
        <p class="display-4">I love <mark style="background-color: lightgreen;">HTML</mark>very much.</p>
        <p class="display-3">The bootstrap is the part of <abbr title="HyperText Markup Language">HTML</abbr>.</p>
        <blockquote>
            <p class="display-4">This is the last part of today's class.</p>
        </blockquote>
    </body>
</html>
