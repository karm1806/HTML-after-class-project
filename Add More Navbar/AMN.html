<html>
    <head>
        <title>Add More Navbar</title>
        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }
            .topnav{
                overflow: hidden;
                background-color: #333;
            }
            .topnav a{
                float: left;
                color: #1affa3;
                text-align: center;
                padding: 14px 16px;
                text-decoration: none;
                font-size: 17px;
            }
            .topnav a:hover{
                background-color: #ddd;
                color: black;
            }
            .topnav a.active{
                background-color: #ffe066;
                color: black;
            }
        </style>
    </head>
    <body>
        <h2>Open different apps or websites by this navbar</h2>
        <div class="topnav">
            <a class="active" href="https://www.google.com/">Google</a>
            <a href="https://www.youtube.com/">Youtube</a>
            <a href="https://drive.google.com/drive/">Google Drive</a>
            <a href="https://chatgpt.com/">Chatgpt</a>
            <a href="https://mail.google.com/mail/u/0/">Gmail</a>
            <a href="https://www.codingal.com/">Codingal</a>
        </div>
    </body>
</html>
