<html>
    <head>
        <h1>This is the grid class.</h1>
        <p>This is of about grid. In the grid it have column, row, grid area, cell etc.</p>
        <style>
            .grid-item1 {grid area:header;}
            .grid-item2 {grid area:menu;}
            .grid-item3 {grid area:main;}
            .grid-item4 {grid area:footer;}
            .grid-container {
                display: grid;
                grid-template-columns: auto auto auto auto auto;
                grid-template-areas:
                'header header header header header'
                'main main main main main'
                'menu footer footer footer footer';
                background-color: mediumseagreen;
                padding: 10px;
            }
            .grid-container div{
                background-color: #f68e77;
                text-align: center;
                padding: 20px;
                border: 3px solid mediumseagreen;
            }
        </style>
    </head>
</html>
