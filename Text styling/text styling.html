<html>
    <head>
        <title>This is the text styling code</title>
        <style>
            h1{
                color: orange;
                font-size:x-large;
                font-family:cursive;
                font-weight:300;
                background-color:antiquewhite;
                text-align: center;
                text-decoration:underline;
                text-transform: capitalize;
                text-decoration-color: yellowgreen;
            }
            h2{
                color: blue;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            .P1{
                color: chartreuse;
                font-size: larger;
                background-color:darkolivegreen;
                text-align: right;
            }
            p{
                color: gold;
            }
        </style>
    </head>
    <body>
        <h1>My name is Karm</h1>
        <h2>I am learning HTML</h2>
        <h2>I am also learning CSS</h2>
        <p class="p1">This is a elephant</p>
        <p>I am belongs from India</p>
        <p>This is an apple</p>
    </body>
</html>
